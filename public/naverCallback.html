<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Naver Login Callback</title>
</head>
<body>
  <script>
    window.addEventListener("load", async () => {
      try {

        const CLIENT_ID = "여기에_네이버_CLIENT_ID";

        const naverLogin = new window.opener.naver.LoginWithNaverId({
          clientId: CLIENT_ID,
          callbackUrl: window.location.href,
          isPopup: true,
        });

        naverLogin.init();

        naverLogin.getLoginStatus(function (status) {

          if (status) {

            const profile = naverLogin.user;

            window.opener.postMessage(
              {
                type: "NAVER_LOGIN_SUCCESS",
                profile,
              },
              window.location.origin
            );

            window.close();

          } else {

            window.opener.postMessage(
              {
                type: "NAVER_LOGIN_FAIL",
                message: "네이버 로그인 실패",
              },
              window.location.origin
            );

            window.close();
          }
        });

      } catch (err) {

        window.opener.postMessage(
          {
            type: "NAVER_LOGIN_FAIL",
            message: err.message,
          },
          window.location.origin
        );

        window.close();
      }
    });
  </script>
</body>
</html>
