<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Naver Login Callback</title>
</head>
<body>

<script>
window.addEventListener("load", () => {

  const CLIENT_ID = "네이버클라이언트아이디";

  const naverLogin = new window.opener.naver.LoginWithNaverId({
    clientId: CLIENT_ID,
    callbackUrl: window.location.href,
    isPopup: true,
  });

  naverLogin.init();

  setTimeout(() => {

    naverLogin.getLoginStatus((status) => {

      console.log("네이버 상태:", status);
      console.log("네이버 유저:", naverLogin.user);

      if (status) {

        const profile = naverLogin.user;

        window.opener.postMessage(
          {
            type: "NAVER_LOGIN_SUCCESS",
            profile,
          },
          "*"
        );

      } else {

        window.opener.postMessage(
          {
            type: "NAVER_LOGIN_FAIL",
            message: "네이버 로그인 실패",
          },
          "*"
        );
      }

      window.close();

    });

  }, 1000);

});
</script>

</body>
</html>
