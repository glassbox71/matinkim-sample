<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Naver Callback</title>
</head>
<body>

<script>

window.addEventListener("load", () => {

  console.log("콜백 시작");

  const CLIENT_ID = "여기에_네이버_CLIENT_ID";

  const CALLBACK_URL =
    "http://localhost:5173/naverCallback.html";

  const naverLogin = new window.opener.naver.LoginWithNaverId({
    clientId: CLIENT_ID,
    callbackUrl: CALLBACK_URL,
    isPopup: true,
  });

  naverLogin.init();

  setTimeout(() => {

    naverLogin.getLoginStatus((status) => {

      console.log("로그인 상태:", status);
      console.log("유저:", naverLogin.user);

      if (status) {

        window.opener.postMessage(
          {
            type: "NAVER_LOGIN_SUCCESS",
            profile: naverLogin.user,
          },
          "*"
        );

      } else {

        window.opener.postMessage(
          {
            type: "NAVER_LOGIN_FAIL",
            message: JSON.stringify(naverLogin.user),
          },
          "*"
        );
      }

      window.close();

    });

  }, 2000);

});

</script>

</body>
</html>
